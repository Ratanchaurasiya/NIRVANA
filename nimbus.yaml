# ==============================================================================
# Nimbus Deployment Specification (nimbus.yaml)
# Nirvana Group website: React + Vite single-page app (static build in dist/)
# ==============================================================================
version: 1

# 1. Runtime
# Vite 8 needs Node 20.19+ or 22.12+. No PHP or Python is used by this site.
runtime:
  node: 22

# 2. Dependency Installation (runs from repository root)
# --include=dev is required: Vite and Tailwind are devDependencies, and they
# would be skipped when NODE_ENV=production, which breaks the build.
install:
  - npm ci --include=dev --prefer-offline

# 3. Build (outputs the production site to dist/)
build:
  - npm run build

# 4. Environment Variables
env:
  NODE_ENV: production
  PORT: "3000"

# 5. Nginx: reverse proxy to the static server that PM2 runs below
nginx:
  proxy_pass: "http://127.0.0.1:3000"

# 6. PM2: serves dist/ using PM2's built-in static file server.
# SPA mode makes direct visits and refreshes on /about, /projects, etc. load
# index.html instead of returning 404.
pm2:
  name: nirvana-group
  script: serve
  instances: 1
  exec_mode: fork
  env:
    PM2_SERVE_PATH: dist
    PM2_SERVE_PORT: 3000
    PM2_SERVE_SPA: "true"
    PM2_SERVE_HOMEPAGE: /index.html
    NODE_ENV: production
